<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小车远程控制台</title>
<style>
  body { font-family: "微软雅黑", sans-serif; background: #faf9f6; text-align: center; }
  h1 { color: #0d6b60; font-size: 22px; }
  canvas { background: #fff; border: 2px solid #0d6b60; border-radius: 6px; }
  button { font-size: 15px; padding: 8px 14px; margin: 4px; border: 1px solid #0d6b60;
           background: #fff; color: #0d6b60; border-radius: 6px; cursor: pointer; }
  button:hover { background: #0d6b60; color: #fff; }
  #pos { font-size: 17px; margin-top: 10px; color: #333; }
  #check { font-size: 17px; color: #d4a017; }
  #sensors, #status { font-size: 15px; color: #555; margin: 2px; }
</style>
</head>
<body>
<h1>智能巡检小车控制台</h1>
<p>点画布 = 自动寻路　W/A/S/D 或按钮 = 手动开车　金色圆圈 = 待巡检点</p>
<canvas id="cv" width="400" height="280"></canvas>
<div>
  <button onclick="move('w')">W · 上</button>
  <button onclick="move('a')">A · 左</button>
  <button onclick="move('s')">S · 下</button>
  <button onclick="move('d')">D · 右</button>
  <button onclick="resetCar()" style="color:#b0532e; border-color:#b0532e;">重置</button>
  <button onclick="autoPatrol()" style="background:#0d6b60; color:#fff;">🤖 自动巡检</button>
</div>
<div id="pos">坐标: (1, 1)</div>
<div id="check">巡检 0 / 3</div>
<div id="sensors">传感器：加载中…</div>
<div id="status">步数 0 · 电量 100%</div>
<script>
const CELL = 40;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let COLS = 10, ROWS = 7;
let maze = null;
let car = { x: 1, y: 1 };
let goal = null;
let pathCells = [];
let isMoving = false;
let checked = [];
let total = 0;
let steps = 0;                  // 【A3】步数：每个浏览器自己记
let battery = 100;              // 【A3】电量：每走一格 -1

function updateStatus() {       // 【A3】状态栏
  const bars = Math.round(battery / 10);
  document.getElementById('status').textContent =
    '步数 ' + steps + ' · 电量 ' + battery + '% ' + '█'.repeat(bars) + '░'.repeat(10 - bars);
}

async function updateSensors() {  // 【A2】从后端拿虚拟传感器读数
  try {
    const r = await fetch('/api/sensors?x=' + car.x + '&y=' + car.y);
    const d = await r.json();
    document.getElementById('sensors').textContent =
      '传感器：上' + (d.w ? '🚫' : '✅') + ' 下' + (d.s ? '🚫' : '✅')
      + ' 左' + (d.a ? '🚫' : '✅') + ' 右' + (d.d ? '🚫' : '✅');
  } catch (err) {
    document.getElementById('sensors').textContent = '传感器：后端离线';
  }
}

function flash(msg) {             // 【A4】提示消息统一走这里
  document.getElementById('pos').textContent += '　' + msg;
}

async function loadMaze() {
  try {
    const r = await fetch('/api/maze');
    const d = await r.json();
    COLS = d.w; ROWS = d.h; maze = d.maze;
    cv.width = COLS * CELL; cv.height = ROWS * CELL;
    const c = await fetch('/api/checkpoints');
    const cd = await c.json();
    checked = cd.checked; total = cd.total;
    updateCheck(); updateSensors(); updateStatus(); draw();
  } catch (err) {
    document.getElementById('pos').textContent = '⚠️ 后端没启动？请先运行 python app.py';
  }
}

function updateCheck() {
  let text = '巡检 ' + checked.length + ' / ' + total;
  if (total > 0 && checked.length === total) text += '　🎉 巡检完成！';
  document.getElementById('check').textContent = text;
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const px = x * CELL, py = y * CELL;
      if (maze[y][x] === 1) {
        ctx.fillStyle = '#4a4a4a';
        ctx.fillRect(px, py, CELL, CELL);
      } else if (maze[y][x] === 2) {
        const key = x + ',' + y;
        if (checked.includes(key)) {
          ctx.fillStyle = '#2e8b57';
          ctx.fillRect(px + 10, py + 10, CELL - 20, CELL - 20);
        } else {
          ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(px + CELL/2, py + CELL/2, CELL/4, 0, Math.PI*2);
          ctx.stroke();
          ctx.lineWidth = 1;
        }
      } else {
        ctx.strokeStyle = '#e5e2d8';
        ctx.strokeRect(px + 0.5, py + 0.5, CELL, CELL);
      }
    }
  }
  ctx.fillStyle = 'rgba(13,107,96,0.25)';
  for (const c of pathCells) ctx.fillRect(c[0]*CELL, c[1]*CELL, CELL, CELL);
  if (goal) {
    ctx.strokeStyle = '#b0532e'; ctx.lineWidth = 3;
    ctx.strokeRect(goal.x*CELL+6, goal.y*CELL+6, CELL-12, CELL-12);
    ctx.lineWidth = 1;
  }
  ctx.fillStyle = '#0d6b60';
  ctx.beginPath();
  ctx.arc(car.x*CELL + CELL/2, car.y*CELL + CELL/2, CELL/3, 0, Math.PI*2);
  ctx.fill();
  document.getElementById('pos').textContent = '坐标: (' + car.x + ', ' + car.y + ')';
}

async function move(direction) {
  if (isMoving) return;
  if (battery <= 0) { flash('🔋 电量耗尽！点重置充电'); return; }   // 【A3】
  try {                                                             // 【A4】网络异常兜底
    const resp = await fetch('/api/move', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ direction: direction, x: car.x, y: car.y })
    });
    if (!resp.ok) { flash('⚠️ 后端返回错误 ' + resp.status); return; }
    const data = await resp.json();
    car.x = data.new_x; car.y = data.new_y;
    checked = data.checked;
    steps = steps + 1; battery = battery - 1;                       // 【A3】
    pathCells = []; goal = null;
    draw(); updateCheck(); updateStatus(); updateSensors();
    if (data.blocked) flash('🚧 被障碍物挡住了！（不耗电）');
    else if (data.checkpoint) flash('📍 打卡成功！');
  } catch (err) {
    flash('⚠️ 后端没启动？请先运行 python app.py');
  }
}

async function resetCar() {
  if (isMoving) return;
  try {
    const r = await fetch('/api/reset', { method: 'POST' });
    const d = await r.json();
    checked = d.checked;
  } catch (err) { /* 后端不在也没关系，本地照样重置 */ }
  car = { x: 1, y: 1 }; goal = null; pathCells = [];
  steps = 0; battery = 100;                                         // 【A3】
  draw(); updateCheck(); updateStatus(); updateSensors();
}

async function animatePath(path) {
  isMoving = true;
  for (let i = 1; i < path.length; i++) {
    if (battery <= 0) { flash('🔋 电量耗尽，自动巡检中断'); break; } // 【A3】
    car.x = path[i][0];
    car.y = path[i][1];
    steps = steps + 1;                                // 自动巡检/BFS 走的每一步同样计步
    battery = battery - 1;
    const c = await fetch('/api/checkpoints');
    const cd = await c.json();
    checked = cd.checked;
    draw(); updateCheck(); updateStatus();
    await new Promise(r => setTimeout(r, 150));
  }
  isMoving = false;
  updateSensors();
}

cv.addEventListener('click', async (e) => {
  if (isMoving) return;
  if (battery <= 0) { flash('🔋 电量耗尽！点重置充电'); return; }
  const rect = cv.getBoundingClientRect();
  const clickX = Math.floor((e.clientX - rect.left) / CELL);
  const clickY = Math.floor((e.clientY - rect.top) / CELL);
  try {
    const resp = await fetch('/api/bfs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sx: car.x, sy: car.y, gx: clickX, gy: clickY })
    });
    const data = await resp.json();
    if (data.found && data.path) {
      goal = { x: clickX, y: clickY };
      pathCells = data.path;
      animatePath(data.path);
    } else {
      flash('那里过不去！（障碍物或不可达）');
    }
  } catch (err) {
    flash('⚠️ 后端没启动？请先运行 python app.py');
  }
});

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ('wasd'.includes(k)) move(k);
});

async function autoPatrol() {          // 【C】自动巡检：挨个去还没打卡的巡检点
  if (isMoving) return;
  if (battery <= 0) { flash('🔋 电量耗尽！点重置充电'); return; }
  isMoving = true;
  const cp = await (await fetch('/api/checkpoints')).json();
  let remaining = cp.points.filter(p => !cp.checked.includes(p[0] + ',' + p[1]));
  while (remaining.length > 0 && battery > 0) {
    let best = null;                                 // 找离车最近的巡检点
    for (const p of remaining) {
      const r = await fetch('/api/bfs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sx: car.x, sy: car.y, gx: p[0], gy: p[1] })
      });
      const d = await r.json();
      if (d.found && (!best || d.path.length < best.path.length)) best = d;
    }
    if (!best) { flash('剩下的巡检点都到不了'); break; }
    isMoving = false;                                // 借用逐格动画
    await animatePath(best.path);
    isMoving = true;
    remaining = remaining.filter(p => !(p[0] === car.x && p[1] === car.y));
  }
  isMoving = false;
  updateSensors();
}

loadMaze();
</script>
</body>
</html>
