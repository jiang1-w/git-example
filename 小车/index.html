<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小车远程控制台</title>
<style>
  body { font-family: "微软雅黑", sans-serif; background: #faf9f6; text-align: center; }
  h1 { color: #0d6b60; font-size: 22px; }
  canvas { background: #fff; border: 2px solid #0d6b60; border-radius: 6px; }
  button { font-size: 16px; padding: 8px 18px; margin: 4px; border: 1px solid #0d6b60;
           background: #fff; color: #0d6b60; border-radius: 6px; cursor: pointer; }
  button:hover { background: #0d6b60; color: #fff; }
  #pos { font-size: 18px; margin-top: 10px; color: #333; }
</style>
</head>
<body>
<h1>小车远程控制台</h1>
<canvas id="cv" width="400" height="320"></canvas>
<div>
  <button onclick="move('w')">W · 上</button>
  <button onclick="move('a')">A · 左</button>
  <button onclick="move('s')">S · 下</button>
  <button onclick="move('d')">D · 右</button>
  <button onclick="resetCar()" style="color:#b0532e; border-color:#b0532e;">重置</button>
</div>
<div id="pos">坐标: (1, 1)</div>
<script>
const COLS = 10, ROWS = 8, CELL = 40;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let car = { x: 1, y: 1 };
let isMoving = false; // 防止动画没走完又点下一个点

// 画图函数
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#ddd';
  for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, ROWS*CELL); ctx.stroke(); }
  for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(COLS*CELL, r*CELL); ctx.stroke(); }
  
  ctx.fillStyle = '#0d6b60';
  ctx.beginPath();
  ctx.arc(car.x*CELL + CELL/2, car.y*CELL + CELL/2, CELL/3, 0, Math.PI*2);
  ctx.fill();
  
  document.getElementById('pos').textContent = '坐标: (' + car.x + ', ' + car.y + ')';
}

// 手动控制函数（键盘/按钮）
async function move(direction) {
  if (isMoving) return; // 动画期间禁用
  
  const resp = await fetch('/api/move', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ direction: direction, x: car.x, y: car.y })
  });
  const data = await resp.json(); 
  
  car.x = data.new_x;
  car.y = data.new_y;
  draw();
}

// 重置小车
function resetCar() {
  if (isMoving) return;
  car.x = 1; car.y = 1;
  draw();
}

// 点击画布触发寻路
cv.addEventListener('click', async (e) => {
  if (isMoving) return; 

  const rect = cv.getBoundingClientRect();
  const clickX = Math.floor((e.clientX - rect.left) / CELL);
  const clickY = Math.floor((e.clientY - rect.top) / CELL);

  const resp = await fetch('/api/bfs', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sx: car.x, sy: car.y, gx: clickX, gy: clickY })
  });
  const data = await resp.json();

  if (data.found && data.path) {
    animatePath(data.path);
  } else {
    console.log("没有路能走过去！");
  }
});

// 键盘监听
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ('wasd'.includes(k)) move(k);
});

// 播放 BFS 路径动画（只保留这一个）
async function animatePath(path) {
  isMoving = true; 
  for (let i = 1; i < path.length; i++) {
    car.x = path[i][0];
    car.y = path[i][1];
    draw(); 
    await new Promise(r => setTimeout(r, 150)); // 停顿 150ms
  }
  isMoving = false; 
}

// 初始化
draw();
</script>
</script>
</body>
</html>
